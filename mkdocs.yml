site_name: jepa.cpp
site_description: CPU inference for the JEPA family (I-JEPA, V-JEPA 2 / 2.1, LeJEPA, LeVJEPA, LeWorldModel) in plain C/C++ on ggml
site_url: https://aselimc.github.io/jepa.cpp/
repo_url: https://github.com/aselimc/jepa.cpp
repo_name: aselimc/jepa.cpp
edit_uri: blob/main/docs/
copyright: MIT licence &middot; <a href="https://github.com/aselimc/jepa.cpp">github.com/aselimc/jepa.cpp</a>

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn
    not_found: warn

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Releases: releases.md
  - Architecture: architecture.md
  - Serving: serving.md
  - GGUF format: gguf-schema.md
  - Benchmarks:
      - Performance: performance.md
      - Accuracy: accuracy.md
  - C API: api.md
  - Internals:
      - Converter: converter.md
      - V-JEPA tensor & RoPE notes: vjepa-notes.md
      - ggml notes: ggml-notes.md
      - Fixtures & golden references: fixtures.md
  - Appendix — raw reports:
      - Parity: parity.md
      - Benchmarks (raw): benchmarks.md
      - Quantization: quantization.md
      - Image accuracy (Imagenette): accuracy-image.md
      - Video accuracy (UCF-101, SSv2): accuracy-video.md
