# Builds the cpp_jepa wheels. Deliberately separate from ci.yml / release.yml: those own the C++
# build and the tagged binaries, this one only drives cibuildwheel over python/, whose whole
# configuration lives in python/pyproject.toml ([tool.cibuildwheel]).
#
# A tag also publishes them to PyPI through Trusted Publishing, so no token is stored. The publisher
# registered on PyPI names this file and the `pypi` environment; renaming either breaks the upload.
# A manual run only builds. If an upload fails, re-running that job publishes the same wheels.
name: wheels

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]   # manylinux x86-64 and macOS arm64
    steps:
      - uses: actions/checkout@v4
        with:
          # The wheel compiles ggml from the submodule, and python/CMakeLists.txt builds against
          # the checkout around python/, so a shallow copy of python/ alone is not enough.
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: python
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
