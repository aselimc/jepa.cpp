name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# One run per ref; a new push supersedes the one in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build and run the suites that need no weights. On a checkout with no GGUFs the CMake asset gates
  # register four: `ops` (3-D RoPE against generated vectors plus the block-causal mask), `attn`
  # (flash vs naive attention against a double-precision reference), `errors` (the loader's and the
  # API's failure paths, on GGUFs it forges itself) and `threads` (the thread contract). Everything
  # else needs a model file and belongs to the `parity` job below.
  build-test-linux:
    name: linux ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CMAKE_BUILD_RPATH=$ORIGIN is only for the artifact below: it lets the staged tools find the
      # ggml shared objects sitting next to them instead of in the build tree they came from.
      - name: configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_LLAMAFILE=ON \
                -DCMAKE_BUILD_RPATH='$ORIGIN'

      - name: build
        run: cmake --build build -j "$(nproc)"

      - name: ctest
        run: ctest --test-dir build --output-on-failure

      - name: stage the tools
        run: |
          mkdir -p dist
          cp build/jepa-embed build/jepa-classify build/jepa-quantize \
             build/jepa-bench build/jepa-info build/jepa-worldmodel dist/
          cp -a build/ggml/src/libggml*.so* dist/
          dist/jepa-info --version

      - uses: actions/upload-artifact@v4
        with:
          name: jepa-tools-${{ matrix.os }}-x86_64
          path: dist
          retention-days: 14

  # macOS arm64. ggml turns GGML_METAL on by default on Apple, so the first build is deliberately
  # -DGGML_METAL=OFF: that is the CPU-only engine this project documents, and the one whose suites
  # are meaningful without a device. The Metal build follows as a separate, build-only step.
  build-macos:
    name: macos-14 arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: configure (CPU only)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_LLAMAFILE=ON -DGGML_METAL=OFF

      - name: build
        run: cmake --build build -j "$(sysctl -n hw.logicalcpu)"

      - name: ctest
        run: ctest --test-dir build --output-on-failure

      # Build only, and no continue-on-error: compiling the Metal backend and its shader library is
      # the part that can break on a source change, and it either succeeds or the job fails. Running
      # anything on the device would need a converted GGUF and a Metal parity tier, neither of which
      # exists yet — jepa.cpp's own GPU path is CUDA (docs/architecture.md "GPU backend").
      - name: build with Metal
        run: |
          cmake -S . -B build-metal -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON
          cmake --build build-metal -j "$(sysctl -n hw.logicalcpu)"

  # MSVC, configure + build only: the runner has no weights and the suites worth running here are
  # the same two the Linux job already runs. Portability fixes this job depends on: /bigobj for the
  # translation units that include third_party/json.hpp, /utf-8 for the sources, and the _WIN32
  # branches in tests/test-attn.cpp (getrusage) and tests/test-ops.cpp (setenv).
  build-windows:
    name: windows msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: configure
        run: cmake -S . -B build -A x64 -DGGML_LLAMAFILE=ON

      - name: build
        run: cmake --build build --config Release -j 4

      - name: version
        run: build\Release\jepa-info.exe --version

  # ASAN + UBSAN over the model-free suites. On a checkout with no GGUFs that is now four: `ops` and
  # `attn` as before, plus `errors` (forged and truncated GGUFs through every loader check, and the
  # NULL / oversized / budget guards of the inference entry points) and `threads` (the thread
  # contract of include/jepa.h). Both of the new ones build what they need in a temp directory, so
  # they need no weights and run here at full strength. -fno-sanitize-recover=all makes a UBSan
  # report a failure rather than a line in the log.
  # OpenMP is off here on purpose: libgomp's thread pool is still allocated at exit and
  # LeakSanitizer reports it, which would force either a suppression file or detect_leaks=0 —
  # turning it off keeps detect_leaks=1 meaningful. ggml then uses its own threadpool, which is the
  # path the sanitizers should cover anyway, and is also the one tests/test-threads.cpp exercises.
  sanitizers:
    name: asan + ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: configure
        run: |
          cmake -S . -B build-asan \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DGGML_LLAMAFILE=ON \
            -DGGML_OPENMP=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: build
        run: cmake --build build-asan -j "$(nproc)"

      - name: ctest
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ctest --test-dir build-asan -N
          ctest --test-dir build-asan --output-on-failure

      # Build-only, and deliberately: a fuzz run is measured in hours and belongs on a developer's
      # box (docs/architecture.md "Robustness"). What CI owes the target is that it still compiles
      # against the current headers, and that the corpus generator still runs.
      - name: build the fuzz target
        run: |
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DJEPA_FUZZ=ON \
                -DJEPA_BUILD_TOOLS=OFF -DGGML_OPENMP=OFF
          cmake --build build-fuzz -j "$(nproc)" --target fuzz-gguf-load
          build-fuzz/fuzz-gguf-load --help

  # The generated artifacts have to match their sources. matplotlib and numpy are pinned because the
  # figure scripts compare committed SVGs byte for byte and another matplotlib re-emits glyph paths
  # differently (scripts/gen_results_figure.py explains this at the top of the file).
  checks:
    name: generated docs and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt
          pip install "numpy==2.5.2" "matplotlib==3.11.1"

      - name: docs/api.md matches include/jepa.h
        run: python scripts/gen_api_md.py --check

      - name: the results figures match their artifacts
        run: |
          python scripts/gen_results_figure.py --check
          python scripts/gen_hero_figure.py --check

      # docs/benchmarks.md has no CI gate: scripts/gen_benchmarks_md.py rebuilds it from the sweep
      # directory tmp/bench, which is git-ignored and measured on a known-idle box. Its `--check`
      # flag is the local gate. What CI can prove is that tests/results/benchmarks{,-gpu}.json still
      # render the same figures, which the step above does.
      - name: the accuracy tables match tests/results/accuracy-image.json
        run: python scripts/render_accuracy_md.py --check

      - name: the site builds
        run: mkdocs build --strict

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  # The suites that need weights. The GGUFs and the PyTorch reference dumps live on the Hugging Face
  # hub; while they are not published the job reports that and stops, rather than failing every pull
  # request. Once the files resolve it runs for real with no change here.
  parity:
    name: parity (hub models)
    runs-on: ubuntu-24.04
    env:
      HUB: https://huggingface.co
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 401/404 means "not published yet" and skips the rest of the job; any other status is a real
      # failure (a broken URL, a rename, the hub down) and is reported as one.
      - name: is the hub set published?
        id: hub
        run: |
          url="$HUB/jepacpp/lewm-pusht-GGUF/resolve/main/lewm-pusht-f32.gguf"
          code=$(curl -sSL -I -o /dev/null -w '%{http_code}' "$url" || echo 000)
          case "$code" in
            200|206) echo "ready=true" >> "$GITHUB_OUTPUT" ;;
            401|404) echo "ready=false" >> "$GITHUB_OUTPUT"
                     echo "The hub model set is not published yet (HTTP $code for $url); the parity suites were not run." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "unexpected HTTP $code for $url" >&2; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        if: steps.hub.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: cache the models and reference dumps
        if: steps.hub.outputs.ready == 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            models/gguf
            tests/fixtures/ref
          key: hub-lejepa-vits16-f32-f16--lewm-pusht-f32--ref-lejepa-vits16-lewm-pusht-v1

      # ~205 MB: 194 MB of GGUF and 11 MB of reference dumps. huggingface_hub rather than curl
      # because the dump directories are listed, not enumerated here, and it handles the listing
      # pagination and the retries.
      - name: download
        if: steps.hub.outputs.ready == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install --quiet huggingface_hub
          python3 - <<'PY'
          from huggingface_hub import hf_hub_download, snapshot_download

          # f32 for the two parity suites, predictor-lewm and the batch bit-exactness check — the
          # ctest registrations in CMakeLists.txt key on the -f32 filenames — and f16 for `backend`.
          for repo, name in [
              ("jepacpp/lejepa-vits16-pretrain-in1k-GGUF", "lejepa-vits16-pretrain-in1k-f32.gguf"),
              ("jepacpp/lejepa-vits16-pretrain-in1k-GGUF", "lejepa-vits16-pretrain-in1k-f16.gguf"),
              ("jepacpp/lewm-pusht-GGUF",                  "lewm-pusht-f32.gguf"),
          ]:
              hf_hub_download(repo_id=repo, filename=name, local_dir="models/gguf")

          snapshot_download(repo_id="jepacpp/jepa.cpp-fixtures", repo_type="dataset",
                            allow_patterns=["ref/lejepa-vits16/*", "ref/lewm-pusht/*"],
                            local_dir="tests/fixtures")
          PY
          du -sh models/gguf tests/fixtures/ref

      # Configure after the download: the parity, predictor, batch and backend suites are registered
      # at configure time from the files that exist (CMakeLists.txt). With this set that is nine
      # suites — parity-lejepa-vits16, parity-lewm-pusht, predictor-lewm, batch, ops, backend, attn,
      # errors and threads; the last two also run in the sanitizers job, there against forged files.
      - name: configure
        if: steps.hub.outputs.ready == 'true'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_LLAMAFILE=ON

      - name: build
        if: steps.hub.outputs.ready == 'true'
        run: cmake --build build -j "$(nproc)"

      - name: ctest
        if: steps.hub.outputs.ready == 'true'
        run: |
          ctest --test-dir build -N
          ctest --test-dir build --output-on-failure
